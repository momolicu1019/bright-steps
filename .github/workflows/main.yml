name: BrightSteps App Build

on:
  push:

jobs:
  build-android:
    name: Build Android App (EAS)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}

    defaults:
      run:
        working-directory: BrightSteps/frontend/BrightStepsApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BrightSteps/frontend/BrightStepsApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo secrets
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Add it in GitHub: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          if [ -z "$EXPO_PROJECT_ID" ]; then
            echo "EXPO_PROJECT_ID is not set. Add your Expo project UUID in GitHub: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app with EAS
        id: eas_build
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          node -e "const fs=require('fs'); const buildData=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(buildData)?buildData[0]:buildData; if(!build?.artifacts?.buildUrl){console.error('Missing build artifact URL in EAS output.'); process.exit(1);} if(!build?.id){console.error('Missing build ID in EAS output.'); process.exit(1);} fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${build.id}\nartifact_url=${build.artifacts.buildUrl}\n`);"

      - name: Compute APK filename
        id: app_meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARTIFACT_NAME="brightsteps-v${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download APK and rename
        run: |
          set -euo pipefail
          curl -fL "${{ steps.eas_build.outputs.artifact_url }}" -o "${{ steps.app_meta.outputs.artifact_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_meta.outputs.artifact_name }}
          path: BrightSteps/frontend/BrightStepsApp/${{ steps.app_meta.outputs.artifact_name }}
          if-no-files-found: error
